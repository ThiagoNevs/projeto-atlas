name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://atlas_ci:atlas_ci@localhost:5432/atlas_ci
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: atlas_ci
          POSTGRES_USER: atlas_ci
          POSTGRES_PASSWORD: atlas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_ci -d atlas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: corepack pnpm db:validate

      - name: Generate Prisma Client
        run: corepack pnpm db:generate

      - name: Validate migration history
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          invalid_changes="$(
            git diff --name-status --find-renames "${BASE_SHA}"...HEAD -- apps/api/prisma/migrations |
              awk '$1 != "A" { print }'
          )"

          if [[ -n "${invalid_changes}" ]]; then
            echo "::error::Migrations historicas nao podem ser modificadas, removidas ou renomeadas."
            printf '%s\n' "${invalid_changes}"
            exit 1
          fi

      - name: Apply migrations
        run: corepack pnpm --filter @atlas/api exec prisma migrate deploy

      - name: Check migration status
        run: corepack pnpm --filter @atlas/api exec prisma migrate status

      - name: Run backend tests
        run: corepack pnpm --filter @atlas/api test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: corepack pnpm --filter @atlas/web test

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://atlas_ci:atlas_ci@localhost:5432/atlas_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: corepack pnpm db:generate

      - name: Run lint
        run: corepack pnpm lint

      - name: Run typecheck
        run: corepack pnpm typecheck

      - name: Run build
        run: corepack pnpm build

      - name: Check diff hygiene
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git diff --check "${BASE_SHA}"...HEAD
          elif [[ -n "${BEFORE_SHA}" ]] &&
            [[ ! "${BEFORE_SHA}" =~ ^0+$ ]] &&
            git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "${BEFORE_SHA}"..HEAD
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          else
            git show --check --format= HEAD
          fi

      - name: Check tracked file hygiene
        shell: bash
        run: |
          set -euo pipefail

          tracked_changes="$(git status --porcelain --untracked-files=no)"

          if [[ -n "${tracked_changes}" ]]; then
            echo "::error::Os gates da CI modificaram arquivos rastreados."
            printf '%s\n' "${tracked_changes}"
            exit 1
          fi
